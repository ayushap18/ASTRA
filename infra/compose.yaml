name: astra
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: astra
      POSTGRES_DB: astra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U astra -d astra"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  intelligence:
    build:
      context: ..
      dockerfile: infra/docker/intelligence.Dockerfile
    environment:
      ASTRA_INTERNAL_TOKEN: ${ASTRA_INTERNAL_TOKEN:?Set ASTRA_INTERNAL_TOKEN in .env}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_MODEL: ${SARVAM_MODEL:-sarvam-105b}
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2
    pids_limit: 64
    networks: [backend]

  core:
    build:
      context: ..
      dockerfile: infra/docker/core.Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ASTRA_ADDR: 0.0.0.0:8080
      ASTRA_API_TOKEN: ${ASTRA_API_TOKEN:?Set ASTRA_API_TOKEN in .env}
      ASTRA_INTERNAL_TOKEN: ${ASTRA_INTERNAL_TOKEN:?Set ASTRA_INTERNAL_TOKEN in .env}
      ASTRA_INTELLIGENCE_URL: http://intelligence:8000
      ASTRA_VERIFIER_URL: http://verifier:8090
      DATABASE_URL: postgres://astra:${POSTGRES_PASSWORD}@postgres:5432/astra?sslmode=disable
      ASTRA_ENABLE_GITHUB: ${ASTRA_ENABLE_GITHUB:-false}
      ASTRA_ENABLE_DEMO: ${ASTRA_ENABLE_DEMO:-true}
      ASTRA_SCAN_RETENTION_AGE: ${ASTRA_SCAN_RETENTION_AGE:-720h}
      ASTRA_SCAN_RETENTION_COUNT: ${ASTRA_SCAN_RETENTION_COUNT:-500}
    depends_on:
      postgres: {condition: service_healthy}
      intelligence: {condition: service_started}
      verifier: {condition: service_started}
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2
    pids_limit: 96
    networks: [backend]

  verifier:
    build:
      context: ..
      dockerfile: infra/docker/verifier.Dockerfile
    environment:
      ASTRA_VERIFIER_ADDR: 0.0.0.0:8090
      ASTRA_INTERNAL_TOKEN: ${ASTRA_INTERNAL_TOKEN:?Set ASTRA_INTERNAL_TOKEN in .env}
      ASTRA_VERIFY_IMAGE: ${ASTRA_VERIFY_IMAGE:-node:22-alpine}
    volumes:
      - ${ASTRA_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    user: "0:0"
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    networks: [backend]

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    environment:
      ASTRA_CORE_URL: http://core:8080
      ASTRA_API_TOKEN: ${ASTRA_API_TOKEN:?Set ASTRA_API_TOKEN in .env}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_MODEL: ${SARVAM_MODEL:-sarvam-105b}
    depends_on:
      core: {condition: service_started}
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    networks: [backend]

networks:
  backend:
volumes:
  postgres-data:
